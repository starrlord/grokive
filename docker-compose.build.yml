# Local build + run (developer machine, source checked out here).
# Usage: docker compose -f docker-compose.build.yml up -d --build
# For deploying on a server from the registry, use docker-compose.yml instead.
services:
  grokive:
    build: .
    image: docker.lessthanpi.com/grokive:latest
    container_name: grokive
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PUID=99
      - PGID=100
      - PORT=8080
      # - BASIC_AUTH_USER=admin
      # - BASIC_AUTH_PASS=change-me
      # Optional: Prompt Studio AI engine (Ollama / OpenAI-compatible /v1 base).
      # Enables semantic prompt search, auto theme clusters, and AI prompt variations.
      # - EMBED_SERVER_URL=http://192.168.1.10:11434/v1
      # - EMBED_MODEL=nomic-embed-text
      # - LLM_SERVER_URL=http://192.168.1.10:11434/v1
      # - LLM_MODEL=dolphin3
    restart: unless-stopped
